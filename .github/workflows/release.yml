name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The buildscript derives the mod version from `git describe`, so a shallow
          # clone would produce a jar named after no tag at all.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      - name: Locate the jar
        id: jar
        run: |
          main=$(ls build/libs/*.jar | grep -Ev -- '-(dev|sources)\.jar$' | head -n1)
          test -n "$main" || { echo "no jar in build/libs"; ls -la build/libs; exit 1; }
          echo "main=$main" >> "$GITHUB_OUTPUT"
          echo "Built $main"
          case "$main" in
            *dirty*|*NO-GIT-TAG-SET*)
              echo "::error::Refusing to release '$main' -- it wasn't built from a clean tagged tree"
              exit 1
              ;;
          esac

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ steps.jar.outputs.main }}
            build/libs/*-sources.jar
          generate_release_notes: true
